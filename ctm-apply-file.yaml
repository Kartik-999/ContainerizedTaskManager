apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctm-deployment
  labels:
    app: CTM-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: CTM-app
  template:
    metadata:
      labels:
        app: CTM-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['sh', '-c', 'until nc -z db-service 3306; do echo waiting for database; sleep 2; done']
      containers:
        - name: k8s-fastapi
          image: kartikchowdary/ctm
          env:
            - name: "MYSQL_USER"
              valueFrom:
                secretKeyRef:
                  name: ctm-secrets
                  key: MYSQL_USER
            - name: "MYSQL_ROOT_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: ctm-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: "MYSQL_HOST"
              valueFrom:
                secretKeyRef:
                  name: ctm-secrets
                  key: MYSQL_HOST
            - name: "MYSQL_DATABASE"
              valueFrom:
                secretKeyRef:
                  name: ctm-secrets
                  key: MYSQL_DATABASE
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: ctm-db
  labels:
    app: CTM-db
spec:
  containers:
    - name: database
      image: mysql
      env:
        - name: "MYSQL_ROOT_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: ctm-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: "MYSQL_DATABASE"
          valueFrom:
            secretKeyRef:
              name: ctm-secrets
              key: MYSQL_DATABASE

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  type: ClusterIP
  selector:
    app: CTM-db
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: CTM-app
  ports:
    - port: 8000
      nodePort: 30008
